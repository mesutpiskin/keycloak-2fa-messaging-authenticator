name: Java CI with Maven

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify with Maven
        run: mvn -B verify --file pom.xml

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-2fa-messaging-authenticator-jar
          path: target/keycloak-2fa-messaging-authenticator*.jar
          if-no-files-found: error

  # The release builds and tests a jar for each of the last 10 Keycloak
  # releases, not only the pom's default version. Building against the oldest
  # of them here catches code or tests that only compile against newer Keycloak
  # APIs before a release, instead of in the publish run.
  build-oldest-keycloak:
    name: Build against oldest published Keycloak
    runs-on: ubuntu-latest

    steps:
      - name: Find the oldest Keycloak version the release publishes for
        id: keycloak
        env:
          GH_TOKEN: ${{ github.token }}
        # Same selection as the kc-version-matrix job in release.yml.
        run: |
          VERSION=$(gh api repos/keycloak/keycloak/releases \
            --jq '[.[] | select(.prerelease == false and .draft == false)] | sort_by(.name)[-10:][0].name')
          echo "Building against Keycloak $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Verify with Maven
        env:
          KC_VERSION: ${{ steps.keycloak.outputs.version }}
        run: mvn -B verify --file pom.xml -Dkeycloak.version="$KC_VERSION"
